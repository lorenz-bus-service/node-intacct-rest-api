name: Publish to npm

# Authenticates to npm with Trusted Publishing (OIDC): no NPM_TOKEN secret.
# One-time setup, after the first manual publish: on npmjs.com open the package,
# Settings > Publishing access > Trusted publisher > GitHub Actions, and enter
# organization lorenz-bus-service, repository node-intacct-rest-api, workflow release.yml.
on:
  release:
    types: [published]
  workflow_dispatch: # re-run a publish for the version in package.json on this branch

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Per https://docs.npmjs.com/trusted-publishers: registry-url is required,
      # no dependency caching in release builds, npm >= 11.5.1, Node >= 22.14.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm --version
      - name: Publish (prerelease versions go to the "beta" dist-tag, stable ones to "latest")
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then TAG=beta; else TAG=latest; fi
          npm publish --access public --provenance --tag "$TAG"
