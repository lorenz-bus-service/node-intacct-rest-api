version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 is the native (Go) compiler; openapi-typescript's generator
      # targets the 5.x compiler API. Stay on 5.x until it supports 7.
      - dependency-name: "typescript"
        versions: [">=7"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
